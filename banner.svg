@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes light{from{opacity:0}to{opacity:1}}
@keyframes shimmer{0%,100%{opacity:1}50%{opacity:.8}}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:.8}}
@keyframes blink{50%{opacity:0}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,25px)}}
.rise{animation:rise .6s ease-out both}
.on{animation:light .35s ease-out both,shimmer 4s ease-in-out infinite}
.cell{animation:pulse 4s ease-in-out infinite}
.cursor{animation:blink 1s steps(1) infinite}
.glow{animation:drift 10s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.rise,.on,.cell,.cursor,.glow{animation:none}}
</style>
